name: staff-pulse

services:
  backend:
    build:
      context: ./backend
    image: staff-pulse-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      LIVE_UPDATES_ENABLED: ${LIVE_UPDATES_ENABLED:-true}
      LIVE_UPDATE_INTERVAL_MS: ${LIVE_UPDATE_INTERVAL_MS:-3000}
      LIVE_UPDATE_MAX_NODES: ${LIVE_UPDATE_MAX_NODES:-3}
      LIVE_HEARTBEAT_INTERVAL_MS: ${LIVE_HEARTBEAT_INTERVAL_MS:-15000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    init: true
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: staff-pulse-client
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
